name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum
      - name: Test
        working-directory: backend
        run: go test -race ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      # A self-referential custom property resolves to nothing, and it fails
      # silently in whichever theme is not being looked at. See the script.
      - name: Theme tokens
        run: node scripts/check-theme-tokens.mjs
      # A breakpoint override placed above its own base rule loses to source
      # order and stops applying, with no CSS error and no browser warning.
      - name: CSS source order
        run: node scripts/check-css-order.mjs
      - name: Build
        working-directory: frontend
        run: npm run build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare disposable configuration
        run: |
          cp .env.example .env
          cp config/volumes.example.yaml config/volumes.yaml
          cp compose.override.example.yml compose.override.yml
          printf 'ci-admin\n' > secrets/admin_username
          printf 'ci-only-long-password\n' > secrets/admin_password
      - name: Pinned image tag must be released
        run: |
          # compose.yml pins an exact image while the project is in rc. A pin
          # pointing at an unpublished tag breaks the README quick start for
          # everyone, and nothing else in CI would notice.
          pinned=$(sed -n 's/.*ghcr.io\/[^:]*:\${DIRDECK_VERSION:-\([^}]*\)}.*/\1/p' compose.yml)
          if [ -z "$pinned" ]; then
            echo "Could not read the pinned image tag from compose.yml" >&2
            exit 1
          fi
          echo "compose.yml pins: $pinned"
          if [ "$pinned" = "latest" ]; then
            echo "latest is only published for stable releases; pin an exact version" >&2
            exit 1
          fi
          git fetch --tags --quiet
          if ! git rev-parse "v$pinned" >/dev/null 2>&1; then
            echo "No git tag v$pinned — compose.yml points at an unpublished image" >&2
            exit 1
          fi

      - name: Validate Compose
        run: docker compose -f compose.build.yml -f compose.override.yml config
      - name: Build container
        run: docker compose -f compose.build.yml -f compose.override.yml build
      - name: Start and verify container
        run: |
          docker compose -f compose.build.yml -f compose.override.yml up -d
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3002/api/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.build.yml -f compose.override.yml logs file-manager
          exit 1
