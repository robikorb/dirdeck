# DirDeck source build, for contributors.
#
# Operators should use compose.yml, which pulls a prebuilt image.
# Usage: docker compose -f compose.build.yml up -d --build
#
# Every setting reads DIRDECK_* first and falls back to the pre-rename LGFM_*
# name, so .env files written before the rename keep working untouched. Compose
# interpolation cannot see the application's own alias handling, so each
# fallback has to be spelled out here as well.
#
# The project name is intentionally left to Compose's directory default: pinning
# it would orphan the containers of installations that predate the rename.
#
# The bundled mounts expose disposable fixtures only. Add explicitly approved
# host paths using the read-only-first procedure in docs/STORAGE-MOUNTS.md.

services:
  file-manager:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DIRDECK_BIND_ADDR:-${LGFM_BIND_ADDR:-127.0.0.1}}:${DIRDECK_PORT:-${LGFM_PORT:-3002}}:8080"
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DIRDECK_LISTEN_ADDR: ":8080"
      DIRDECK_DATA_DIR: /var/lib/file-manager
      DIRDECK_VOLUMES_FILE: /etc/dirdeck/volumes.yaml
      DIRDECK_ADMIN_USERNAME_FILE: /run/secrets/admin_username
      DIRDECK_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DIRDECK_SECURE_COOKIE: "${DIRDECK_SECURE_COOKIE:-${LGFM_SECURE_COOKIE:-false}}"
      DIRDECK_LOGIN_RATE_LIMIT_MAX: "${DIRDECK_LOGIN_RATE_LIMIT_MAX:-${LGFM_LOGIN_RATE_LIMIT_MAX:-10}}"
      DIRDECK_LOGIN_RATE_LIMIT_SEC: "${DIRDECK_LOGIN_RATE_LIMIT_SEC:-${LGFM_LOGIN_RATE_LIMIT_SEC:-60}}"
      DIRDECK_SESSION_TTL_HOURS: "${DIRDECK_SESSION_TTL_HOURS:-${LGFM_SESSION_TTL_HOURS:-12}}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-022}"
    volumes:
      - type: bind
        source: ./config/volumes.yaml
        target: /etc/dirdeck/volumes.yaml
        read_only: true
      - type: bind
        source: ./secrets/admin_username
        target: /run/secrets/admin_username
        read_only: true
      - type: bind
        source: ./secrets/admin_password
        target: /run/secrets/admin_password
        read_only: true
      - type: bind
        source: ./fixtures/ro
        target: /mnt/volumes/fixture-ro
        read_only: true
      - type: bind
        source: ./fixtures/rw
        target: /mnt/volumes/fixture-rw
      - type: volume
        source: app-state
        target: /var/lib/file-manager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  app-state:
    name: "${DIRDECK_DATA_VOLUME:-${LGFM_DATA_VOLUME:-liquid-glass-file-manager_app-state}}"
