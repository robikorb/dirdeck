# Source-build override only. Copy this file to compose.override.yml and run
# `docker compose -f compose.build.yml -f compose.override.yml up -d --build`.
# The normal image-based compose.yml uses a different service name and does not
# load this file. Keep host-specific mounts here so source checkouts remain
# upgradeable from Git.
services:
  file-manager:
    volumes:
      # Start real storage read-only. The target must be unique and below
      # /mnt/volumes. Add a matching entry to config/volumes.yaml.
      #
      # - type: bind
      #   source: /path/on/the/host
      #   target: /mnt/volumes/media
      #   read_only: true
