# DirDeck — self-hosted dual-pane file manager.
#
#   mkdir dirdeck && cd dirdeck
#   curl -O https://raw.githubusercontent.com/robikorb/dirdeck/main/compose.yml
#   # edit the volumes: section below to point at your storage
#   docker compose up -d
#   docker compose logs dirdeck | grep -A5 "administrator account"
#
# This file is self-contained: no clone, no build, no config files. Every
# directory you bind-mount under /mnt/volumes/ appears in the app automatically.
#
# Volumes are READ-ONLY until you opt in. Browse first, confirm you are looking
# at the right disk, then add its name to DIRDECK_WRITABLE and restart.
#
# Contributors building from source: use compose.build.yml instead.

name: dirdeck

services:
  dirdeck:
    # Pinned while the project is in release candidates: `latest` only moves on a
    # stable release, so defaulting to it would leave this file pointing at a tag
    # that does not exist. Set DIRDECK_VERSION to upgrade.
    image: ghcr.io/robikorb/dirdeck:${DIRDECK_VERSION:-0.2.0-rc.6}
    container_name: dirdeck
    restart: unless-stopped
    stop_grace_period: 30s

    ports:
      # Localhost only by default. Read docs/SECURITY.md before widening this:
      # plain HTTP sends the password and session cookie in the clear.
      - "${DIRDECK_BIND_ADDR:-${LGFM_BIND_ADDR:-127.0.0.1}}:${DIRDECK_PORT:-${LGFM_PORT:-3002}}:8080"

    environment:
      DIRDECK_LISTEN_ADDR: ":8080"

      # Comma-separated volume names that may be written to; "*" allows all.
      # Anything not listed stays read-only.
      DIRDECK_WRITABLE: "${DIRDECK_WRITABLE:-}"

      # Set true when a reverse proxy terminates HTTPS in front of DirDeck.
      DIRDECK_SECURE_COOKIE: "${DIRDECK_SECURE_COOKIE:-${LGFM_SECURE_COOKIE:-false}}"

      DIRDECK_LOGIN_RATE_LIMIT_MAX: "${DIRDECK_LOGIN_RATE_LIMIT_MAX:-${LGFM_LOGIN_RATE_LIMIT_MAX:-10}}"
      DIRDECK_LOGIN_RATE_LIMIT_SEC: "${DIRDECK_LOGIN_RATE_LIMIT_SEC:-${LGFM_LOGIN_RATE_LIMIT_SEC:-60}}"
      DIRDECK_SESSION_TTL_HOURS: "${DIRDECK_SESSION_TTL_HOURS:-${LGFM_SESSION_TTL_HOURS:-12}}"
      # Per-file streaming limit in bytes. The default is 1 TiB.
      DIRDECK_MAX_UPLOAD_BYTES: "${DIRDECK_MAX_UPLOAD_BYTES:-${LGFM_MAX_UPLOAD_BYTES:-1099511627776}}"

      # Ownership for anything DirDeck creates. On Linux use `id -u` / `id -g`.
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-022}"

    volumes:
      # ----------------------------------------------------------------
      # YOUR STORAGE — add one line per folder or disk you want to manage.
      # The name after /mnt/volumes/ is what appears in the sidebar.
      #
      #   - /srv/media:/mnt/volumes/media
      #   - /mnt/photos:/mnt/volumes/photos
      #
      # Never mount the Docker socket, /, or system directories here.
      # ----------------------------------------------------------------
      - ${DIRDECK_FIRST_MOUNT:-./files}:/mnt/volumes/files

      # Application database: sessions, favorites, transfer history.
      # Deleting this volume resets the application.
      - dirdeck-data:/var/lib/file-manager

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  dirdeck-data:
    name: "${DIRDECK_DATA_VOLUME:-${LGFM_DATA_VOLUME:-dirdeck-data}}"
